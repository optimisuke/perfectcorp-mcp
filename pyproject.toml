[project]
name = "perfectcorp-mcp"
version = "0.1.0"
description = "MCP server for Perfect Corp AI APIs (Skin, Face, Hair Analysis)"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
perfectcorp-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perfectcorp"]
